name: Arabic i18n targeted

on:
  push:
    branches:
      - ci/ar-i18n-base-fd760

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ar-locale-catchup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Use npm 12
        run: npm --version | grep -q '^12\.' || npm i -g npm@12
      - name: Install dependencies
        run: npm ci
      - name: Desktop i18n coverage
        run: npm exec --workspace apps/desktop -- vitest run src/i18n/coverage.test.ts --project ui
      - name: Web i18n coverage
        run: npm exec --workspace web -- vitest run src/i18n/coverage.test.ts
